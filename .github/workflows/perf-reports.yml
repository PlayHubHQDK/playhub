name: Build performance data

on:
  issues:
    types: [opened, edited, labeled]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  build:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'perf-report')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-perf-data.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "playhub-bot"
          git config user.email "actions@github.com"
          git add docs/data/reports.json
          git diff --cached --quiet || git commit -m "Update community performance data"
          git push
